[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cumcm-b"
version = "0.1.0"
description = "CUMCM 2026 B: bounded-error localization and complete radio-source coverage"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Oblivionfun"}]
dependencies = ["numpy>=2.0", "scipy>=1.14", "shapely>=2.0", "requests>=2.32"]

[project.optional-dependencies]
research = ["pandas>=2.2", "matplotlib>=3.9", "seaborn>=0.13", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2"]

[project.scripts]
cumcm-b-benchmark = "cumcm_b.benchmark:main"
cumcm-b-practice = "cumcm_b.practice:main"

[project.urls]
Repository = "https://github.com/Oblivionfun/shuxuejianmo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local", "reports", "results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_figures.py" = ["E402"]
