name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/validated-py312.txt
      - name: Install
        run: python -m pip install -e ".[research,dev]" -c requirements/validated-py312.txt
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Format
        run: python -m ruff format --check src scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Synthetic smoke
        run: python -m cumcm_b.benchmark --smoke --out .local/ci-smoke
      - name: Published result contract
        run: python scripts/check_results.py
      - name: Build wheel
        run: python -m build --wheel
